<app-page-card [title]="'backoffice.operations.title' | translate">
  <p class="mb-4 text-sm text-slate-400">{{ 'backoffice.operations.hint' | translate }}</p>
  <button
    type="button"
    class="rounded-lg bg-amber-700 px-4 py-2 text-sm text-white hover:bg-amber-600"
    (click)="clearCache()"
  >
    {{ 'backoffice.operations.clearCache' | translate }}
  </button>
  @if (message()) {
    <p class="mt-3 text-sm text-green-400">{{ message()! | translate }}</p>
  }
</app-page-card>
