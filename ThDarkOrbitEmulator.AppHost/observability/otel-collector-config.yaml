receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
  resource:
    attributes:
      - key: service.namespace
        value: thdarkorbit
        action: upsert

exporters:
  prometheus:
    endpoint: 0.0.0.0:8889
  otlp/aspire:
    endpoint: ${env:ASPIRE_OTLP_ENDPOINT}
    tls:
      insecure: true

service:
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [resource, batch]
      exporters: [prometheus]
    traces:
      receivers: [otlp]
      processors: [resource, batch]
      exporters: [otlp/aspire]
    logs:
      receivers: [otlp]
      processors: [resource, batch]
      exporters: [otlp/aspire]
